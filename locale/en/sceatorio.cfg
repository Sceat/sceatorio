[mod-setting-description]
sceatorio-evolution-enabled=When disabled, each team's current enemy evolution is frozen. Kill counters and surface nest-consumption diagnostics advance without being back-charged after re-enabling.
sceatorio-evolution-time-per-minute=Raw evolution added once per minute while at least one member of a team is connected on that surface. Multiple teammates do not multiply time.
sceatorio-evolution-worm-per-kill=Raw evolution added when a team kills a worm belonging to its own enemy force on that surface.
sceatorio-evolution-spawner-per-kill=Raw evolution added when a team kills a spawner belonging to its own enemy force on that surface.
sceatorio-evolution-pollution-per-unit=Raw evolution added for each new pollution unit recorded in that surface's cumulative output statistics for unit-spawner prototypes. Factorio exposes these counters per surface, not per force, so every team recorded there receives the same consumed delta. Gross emissions and non-spawner outputs do not count; trees and scrubbers can reduce future evolution by intercepting pollution before it reaches a nest.
sceatorio-vanilla-evolution-policy=The engine's shared evolution accumulator always stays disabled so it cannot double-count team ledgers. Disable also zeros its component coefficients; Preserve retains their configured numeric values for compatibility while leaving the accumulator off.
sceatorio-electricity-isolation=Disconnects direct copper links between different teams, rejects/refunds player or robot builds that would implicitly use another team's electric network, and rejects conflicting script-raised builds or clones. Neutral, enemy, system forces, and space platforms are not modified.
sceatorio-electricity-sharing-policy=Mutual permits a pair only after both team owners opt in with /sceatorio-power-share. Isolated denies all cross-team sharing even when both teams opted in. Revocation removes direct links and blocks new implicit overlaps; relocate any implicit overlap that was accepted earlier.
sceatorio-offline-defense-enabled=Immediately makes registered team-owned buildings, belts, rails, poles, turrets, roboports, vehicles, trains, land mines, and Space Age platform structures unbreakable when the last team member disconnects. The first returning member restores each entity's exact prior destructible state. Disable this setting before removing the mod so protected entities can be restored.
sceatorio-planet-spawns-enabled=Records one stable spawn for each team on each real planet after the first physical arrival. Space platforms and remote-view surfaces are excluded.
sceatorio-planet-spawn-safety-radius=Search radius for a non-colliding character position and, on Nauvis or Gleba only, the immediate hostile clearing radius. Native tiles, resources, cliffs, decoratives, and special enemies are never rewritten.
sceatorio-planet-spawn-separation=Minimum distance between different teams' recorded or pending spawns on the same planet surface. Changing this does not relocate stable existing spawns.
sceatorio-robot-policy-mode=Enforce (the default) reports teams that reach a cap and pauses registered crafting machines whose current recipe produces the capped robot class. Warn reports without pausing. Disabled performs no recurring robot checks. Existing, flying, manually supplied, imported, and stored robots are never moved, deleted, or hidden.
sceatorio-logistic-robot-cap=Maximum total logistic robots across all fixed networks and surfaces owned by one team, so splitting networks cannot evade the budget. The default is intentionally conservative for multiplayer UPS. Set to 0 for unlimited.
sceatorio-construction-robot-cap=Maximum total construction robots across all fixed networks and surfaces owned by one team. The higher default leaves room for large builds and repairs. Set to 0 for unlimited.
sceatorio-ai-enabled=Server-wide opt-in for the localhost MCP gateway. Off by default. Factorio must also be started with --enable-lua-udp before a sidecar can connect.
sceatorio-ai-allowed-capabilities=Comma-separated server allowlist intersected with the researched technology and the pairing. Unknown names are ignored.
sceatorio-ai-requests-per-minute=Maximum requests accepted for one player across all of their clients during each minute of game time.
sceatorio-ai-expensive-requests-per-minute=Separate per-player budget for event waits, map, entity, train, logistics, transport, blueprint, and bounded control calls.
sceatorio-ai-global-requests-per-minute=Maximum requests accepted across every player and client in this save during each minute of game time. This is checked atomically with the per-player budgets.
sceatorio-ai-global-expensive-requests-per-minute=Maximum event waits, map, entity, train, logistics, transport, blueprint, and bounded control requests accepted across the save during each minute of game time. This is checked atomically with every other request budget.
sceatorio-dev-tools-enabled=Shows temporary administrator-only diagnostics and test controls, including safe-arrival exercises and force-local research completion. Disabled by default for production servers.

[entity-name]
sceatorio-ai-uplink=AI Uplink
sceatorio-ai-input-port=AI Input Port
sceatorio-ai-output-port=AI Output Port

[entity-description]
sceatorio-ai-uplink=A powered, force-scoped endpoint for an opted-in localhost MCP pairing. It does not move the character or place entities.
sceatorio-ai-input-port=A dedicated force-owned circuit endpoint that scoped AI clients may read. It never writes to connected machines.
sceatorio-ai-output-port=A dedicated force-owned circuit endpoint for slow, TTL-cleared AI signals. AI clients cannot write to ordinary combinators or machines.

[technology-name]
sceatorio-ai-assistance=AI Assistance

[technology-description]
sceatorio-ai-assistance=Unlocks the AI Uplink and the complete scoped MCP interface. Server policy stays off by default, and creating a pairing code at a powered Uplink is your own opt-in.

[gui]
sceatorio-ai-uplink-title=AI Uplink
sceatorio-ai-uplink-policy=Create a one-time, short-lived code to connect your AI assistant. Its access stays limited to your team and the permissions approved by you and the server.
sceatorio-ai-create-pairing=Create one-time pairing code
sceatorio-ai-revoke=Revoke
sceatorio-ai-revoked=Pairing revoked.
sceatorio-ai-pairing-created=Code created. Enter it in your AI assistant before it expires; it can only be used once.
sceatorio-ai-pairing-code-expires=One-time code (consumed on use; expires at tick __1__):
sceatorio-ai-blueprints-button=AI blueprints
sceatorio-ai-blueprints-tooltip=AI blueprints\nThis window is the inbox itself. Books come first, then the blueprints no book holds: a blueprint you filed in a book is inside that book instead of being listed a second time. A blueprint or book you take out and keep is removed from the inbox when the window closes; put it back before closing to keep it saved. Taking a book out never deletes the blueprints inside it, and they are listed on their own again the next time you open this window.
sceatorio-ai-blueprints-title=AI blueprint inbox
sceatorio-ai-blueprints-empty=Nothing here yet. Ask your AI assistant to save a blueprint and it will show up in this inbox.
sceatorio-ai-blueprints-returned=Returned __1__ item(s) you left in the AI blueprint inbox: it only holds the blueprints your assistant saved.
sceatorio-ai-blueprints-removed=Removed __1__ blueprint(s) from your AI inbox: you carried them out of the window. This cannot be undone.
sceatorio-ai-blueprints-book-removed=Removed __1__ blueprint book(s) from your AI inbox: you carried them out of the window. The blueprints they grouped are still saved and are listed on their own from now on.
sceatorio-ai-blueprints-ambiguous=__1__ item(s) you took out share a name with another saved blueprint or book, so nothing was deleted. Ask your AI assistant to delete by ID.
sceatorio-ai-blueprints-failed=__1__ saved blueprint(s) could not be rebuilt and are missing from this window.

