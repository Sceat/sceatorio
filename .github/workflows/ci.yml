name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and reproducible package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Run Lua-state and static regression tests
        run: sh tests/run.sh

      - name: Check generated documentation and release contracts
        run: |
          python3 scripts/sync_docs.py --check
          python3 scripts/validate.py

      - name: Check shell tooling
        run: shellcheck scripts/install-local.sh tests/headless/run.sh tests/headless/ci.sh

      - name: Check MCP schemas, authorization, transport, and types
        working-directory: mcp
        run: |
          npm ci
          npm run check

      - name: Build the deterministic archive twice
        run: |
          mkdir -p dist
          second_dir=$(mktemp -d)
          archive=$(python3 scripts/package.py --output dist)
          second=$(python3 scripts/package.py --output "$second_dir")
          cmp "$archive" "$second"
          python3 scripts/validate.py --archive "$archive"
          archive_name=$(basename "$archive")
          (cd dist && sha256sum "$archive_name" > "$archive_name.sha256")

      - name: Retain the reviewed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sceatorio-${{ github.sha }}
          path: |
            dist/Sceatorio_*.zip
            dist/Sceatorio_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  engine:
    name: Pinned Factorio headless integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js for the AI gateway test
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Read pinned headless provenance from the test matrix
        run: python3 tests/headless/matrix.py tests/headless/matrix.json headless-env >> "$GITHUB_ENV"

      - name: Download and verify the exact free Linux headless build
        run: |
          archive="$RUNNER_TEMP/$FACTORIO_HEADLESS_FILENAME"
          install_root="$RUNNER_TEMP/factorio-headless"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --show-error --silent --output "$archive" "$FACTORIO_HEADLESS_URL"
          printf '%s  %s\n' "$FACTORIO_HEADLESS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_root"
          tar --extract --xz --file "$archive" --directory "$install_root"
          factorio_bin="$install_root/factorio/bin/x64/factorio"
          test -x "$factorio_bin"
          actual_version=$("$factorio_bin" --version | sed -n 's/^Version: \([^ ]*\).*/\1/p' | head -n 1)
          test "$actual_version" = "$FACTORIO_VERSION"
          echo "FACTORIO_BIN=$factorio_bin" >> "$GITHUB_ENV"

      - name: Install locked MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Run the real base, Space Age, multiplayer, fixture, and AI matrix
        run: sh tests/headless/ci.sh
