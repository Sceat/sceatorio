name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "release tag commit is not on origin/$DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Validate the tag and public contracts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/sync_docs.py --check
          python3 scripts/validate.py --tag "$RELEASE_TAG"

      - name: Run Lua-state and static regression tests
        run: sh tests/run.sh

      - name: Check shell tooling
        run: shellcheck scripts/install-local.sh tests/headless/run.sh tests/headless/ci.sh

      - name: Check MCP schemas, authorization, transport, and types
        working-directory: mcp
        run: |
          npm ci
          npm run check

      - name: Read pinned headless provenance from the test matrix
        run: python3 tests/headless/matrix.py tests/headless/matrix.json headless-env >> "$GITHUB_ENV"

      - name: Download and verify the exact free Linux headless build
        run: |
          archive="$RUNNER_TEMP/$FACTORIO_HEADLESS_FILENAME"
          install_root="$RUNNER_TEMP/factorio-headless"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --show-error --silent --output "$archive" "$FACTORIO_HEADLESS_URL"
          printf '%s  %s\n' "$FACTORIO_HEADLESS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_root"
          tar --extract --xz --file "$archive" --directory "$install_root"
          factorio_bin="$install_root/factorio/bin/x64/factorio"
          test -x "$factorio_bin"
          actual_version=$("$factorio_bin" --version | sed -n 's/^Version: \([^ ]*\).*/\1/p' | head -n 1)
          test "$actual_version" = "$FACTORIO_VERSION"
          echo "FACTORIO_BIN=$factorio_bin" >> "$GITHUB_ENV"

      - name: Run the real base, Space Age, multiplayer, fixture, and AI matrix
        run: sh tests/headless/ci.sh

      - name: Build and verify the deterministic archive twice
        run: |
          mkdir -p dist
          second_dir=$(mktemp -d)
          archive=$(python3 scripts/package.py --output dist)
          second=$(python3 scripts/package.py --output "$second_dir")
          cmp "$archive" "$second"
          python3 scripts/validate.py --archive "$archive"
          archive_name=$(basename "$archive")
          (cd dist && sha256sum "$archive_name" > "$archive_name.sha256")

      - name: Store the exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sceatorio-release-${{ github.ref_name }}
          path: |
            dist/Sceatorio_*.zip
            dist/Sceatorio_*.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish approved bytes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: factorio-mod-portal
    permissions:
      contents: write
    steps:
      - name: Check out the publishing client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download the exact reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sceatorio-release-${{ github.ref_name }}
          path: dist

      - name: Verify downloaded bytes
        run: |
          cd dist
          sha256sum --check Sceatorio_*.zip.sha256

      - name: Require the scoped Mod Portal credential before publication
        env:
          FACTORIO_MOD_PORTAL_API_KEY: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}
        run: |
          test -n "$FACTORIO_MOD_PORTAL_API_KEY"

      - name: Publish and verify through the official Mod Portal v2 API
        env:
          FACTORIO_MOD_PORTAL_API_KEY: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}
        run: python3 scripts/publish_mod_portal.py dist/Sceatorio_*.zip

      - name: Publish and verify Mod Portal presentation
        env:
          FACTORIO_MOD_PORTAL_API_KEY: ${{ secrets.FACTORIO_MOD_PORTAL_API_KEY }}
        run: python3 scripts/update_portal_details.py --apply

      - name: Create or verify the GitHub Release with the same bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive=$(find dist -maxdepth 1 -type f -name 'Sceatorio_*.zip' -print)
          checksum=$archive.sha256
          archive_name=$(basename "$archive")
          checksum_name=$(basename "$checksum")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            verification_dir=$(mktemp -d)
            gh release download "$RELEASE_TAG" \
              --dir "$verification_dir" \
              --pattern "$archive_name" \
              --pattern "$checksum_name"
            cmp "$archive" "$verification_dir/$archive_name"
            cmp "$checksum" "$verification_dir/$checksum_name"
          else
            gh release create "$RELEASE_TAG" \
              "$archive" \
              "$checksum" \
              --verify-tag \
              --title "Sceatorio ${RELEASE_TAG#v}" \
              --generate-notes
          fi
